<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCC Attendance Overlap Network</title>
  <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #f4f1e8;
      --panel: #fffaf0;
      --ink: #1f1f1f;
      --muted: #4a4a4a;
      --blue: #1f78b4;
      --orange: #d95f02;
      --line: #c8bfae;
    }
    body {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--ink);
      background: radial-gradient(circle at 15% 15%, #fffbe9 0%, var(--bg) 55%);
    }
    .wrap {
      max-width: 1200px;
      margin: 22px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 14px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.55rem;
      letter-spacing: 0.01em;
    }
    .sub {
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.45;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 10px 0 10px;
      font-size: 0.95rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    #network {
      width: 100%;
      height: 68vh;
      min-height: 480px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      margin: 12px 0;
      font-size: 0.95rem;
    }
    .meta {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>South Carolina College: Attendance Years + Network Overlap</h1>
      <div class="sub">Dashed blue edges show overlapping years at South Carolina College. Solid orange edges show existing relationship ties in Unionism Network data.</div>

      <div class="legend">
        <span class="chip"><span class="dot" style="background:#2e8b57"></span>Attendee (start/end years known)</span>
        <span class="chip"><span class="dot" style="background:#8f8f8f"></span>Attendee (partial years)</span>
        <span class="chip"><span style="width:22px; border-top:2px dashed var(--blue); display:inline-block"></span>Year overlap</span>
        <span class="chip"><span style="width:22px; border-top:2px solid var(--orange); display:inline-block"></span>Network tie</span>
      </div>

      <div class="controls">
        <label><input type="checkbox" id="showOverlap" checked /> Show year-overlap edges</label>
        <label><input type="checkbox" id="showRel" checked /> Show relationship edges</label>
      </div>

      <div id="network"></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <script>
    const attendeeNodes = [{"id": 685, "label": "JAMES LOUIS PETIGRU", "title": "JAMES LOUIS PETIGRU<br>Role: Student<br>Years: 1806-1809", "start_year": 1806, "end_year": 1809, "role": "Student", "group": "known"}, {"id": 224, "label": "James Henry Hammond", "title": "James Henry Hammond<br>Role: Student<br>Years: 1821-1825", "start_year": 1821, "end_year": 1825, "role": "Student", "group": "known"}, {"id": 1340, "label": "Dr. Jas. H. Carlisle", "title": "Dr. Jas. H. Carlisle<br>Role: Student<br>Years: 1840-1844", "start_year": 1840, "end_year": 1844, "role": "Student", "group": "known"}, {"id": 1341, "label": "Henry McIver", "title": "Henry McIver<br>Role: Student<br>Years: 1840-1844", "start_year": 1840, "end_year": 1844, "role": "Student", "group": "known"}, {"id": 1339, "label": "WIlliam F. B. Haynsworth", "title": "WIlliam F. B. Haynsworth<br>Role: Student<br>Years: 1840-1844", "start_year": 1840, "end_year": 1844, "role": "Student", "group": "known"}, {"id": 507, "label": "William John Grayson", "title": "William John Grayson<br>Role: Student<br>Years: ?-1809", "start_year": null, "end_year": 1809, "role": "Student", "group": "partial"}];
    const overlapEdges = [{"from": 1340, "to": 1341, "label": "SCC overlap 1840-1844", "title": "Shared years at SCC: 1840-1844 (5 years)", "color": {"color": "#1f78b4"}, "dashes": true, "width": 6, "kind": "overlap"}, {"from": 1340, "to": 1339, "label": "SCC overlap 1840-1844", "title": "Shared years at SCC: 1840-1844 (5 years)", "color": {"color": "#1f78b4"}, "dashes": true, "width": 6, "kind": "overlap"}, {"from": 1341, "to": 1339, "label": "SCC overlap 1840-1844", "title": "Shared years at SCC: 1840-1844 (5 years)", "color": {"color": "#1f78b4"}, "dashes": true, "width": 6, "kind": "overlap"}];
    const relationshipEdges = [{"from": 507, "to": 685, "label": "friendship", "title": "Network tie: friendship<br>Date: 1804-10-01 to 1863-03-09", "color": {"color": "#d95f02"}, "dashes": false, "width": 2, "kind": "relationship", "start_year": 1804, "end_year": 1863}, {"from": 1339, "to": 1340, "label": "friendship", "title": "Network tie: friendship<br>Date: 1840 to 1905", "color": {"color": "#d95f02"}, "dashes": false, "width": 2, "kind": "relationship", "start_year": 1840, "end_year": 1905}, {"from": 1339, "to": 1341, "label": "friendship", "title": "Network tie: friendship<br>Date: 1840 to 1905", "color": {"color": "#d95f02"}, "dashes": false, "width": 2, "kind": "relationship", "start_year": 1840, "end_year": 1905}, {"from": 1340, "to": 1341, "label": "friendship", "title": "Network tie: friendship<br>Date: 1840 to 1905", "color": {"color": "#d95f02"}, "dashes": false, "width": 2, "kind": "relationship", "start_year": 1840, "end_year": 1905}];

    const nodes = new vis.DataSet(attendeeNodes.map(n => ({
      ...n,
      shape: 'dot',
      size: 18,
      font: { face: 'Georgia', size: 15 },
      color: n.group === 'known'
        ? { background: '#2e8b57', border: '#1f5f3e', highlight: { background: '#3ca86a', border: '#1f5f3e' } }
        : { background: '#8f8f8f', border: '#5f5f5f', highlight: { background: '#a3a3a3', border: '#5f5f5f' } }
    })));

    const allEdges = [...overlapEdges, ...relationshipEdges];
    const edges = new vis.DataSet(allEdges);

    const network = new vis.Network(
      document.getElementById('network'),
      { nodes, edges },
      {
        interaction: { hover: true, tooltipDelay: 90 },
        physics: {
          stabilization: true,
          barnesHut: { gravitationalConstant: -2400, springLength: 175, springConstant: 0.03 }
        },
        edges: {
          smooth: { type: 'dynamic' },
          font: { align: 'middle', size: 11, face: 'Georgia' }
        },
        layout: { improvedLayout: true }
      }
    );

    function renderMeta() {
      const n = attendeeNodes.length;
      const o = overlapEdges.length;
      const r = relationshipEdges.length;
      document.getElementById('meta').textContent = `Attendees: ${n} | Overlap edges: ${o} | Relationship edges: ${r}`;
    }

    function applyFilters() {
      const showOverlap = document.getElementById('showOverlap').checked;
      const showRel = document.getElementById('showRel').checked;
      const filtered = allEdges.filter(e =>
        (showOverlap && e.kind === 'overlap') ||
        (showRel && e.kind === 'relationship')
      );
      edges.clear();
      edges.add(filtered);
    }

    document.getElementById('showOverlap').addEventListener('change', applyFilters);
    document.getElementById('showRel').addEventListener('change', applyFilters);

    applyFilters();
    renderMeta();
  </script>
</body>
</html>
